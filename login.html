<!-- Head -->

<body>


	<div class="min-vh-100 d-flex flex-column">


		<nav class="navbar navbar-expand-lg bg-danger">
			<div class="container-fluid">
				<a class="navbar-brand text-uppercase text-white fw-bold" href="#"><i
						class="fa-solid fa-shield-halved"></i> Phishing
					Detection</a>
				<button class="navbar-toggler" type="button" data-bs-toggle="collapse"
					data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
					aria-expanded="false" aria-label="Toggle navigation">
					<span class="navbar-toggler-icon"></span>
				</button>
				<div class="collapse navbar-collapse" id="navbarSupportedContent">
					<ul class="navbar-nav ms-auto mb-2 mb-lg-0">
						<li class="nav-item">
							<a class="nav-link active text-white fw-bold" id="homed" aria-current="page"
								href="index">Home</a>
						</li>
						<li class="nav-item">
							<a class="nav-link text-white fw-bold" id="register" href="register">Register</a>
						</li>
						<li class="nav-item">
							<a class="nav-link text-white fw-bold text-decoration-underline link-offset-2" id="login"
								href="login">Login</a>
						</li>
					</ul>
				</div>
			</div>
		</nav>


		<div class="container py-5 my-auto">
			<div class="row d-flex justify-content-center align-items-center">
				<div class="col-md-12">
					<div class="card rounded text-black  border border-danger-subtle shadow-sm">

						<div class="row g-0">

							<div class="col-md-6 d-flex align-items-center">
								<div class="card-body p-md-5 py-4 mx-md-4 mx-2">

									<div class="text-center">
										<h3 class="mb-5 text-decoration-underline link-offset-2 text-danger  ">
											Login
										</h3>
									</div>
									<form id="f1" runat="server">

										<div class="row gy-3">

											<div class="col-md-12">
												<label class="form-label">User Email:</label>
												<div class="form-group">
													<input type="email" class="form-control shadow-none border-danger" id="email" runat="server"
														placeholder="Enter Email">
												</div>
											</div>

											<div class="col-md-12">
												<label class="form-label">Password:</label>
												<div class="form-group">
													<input type="password" class="form-control shadow-none border-danger" id="pswd" runat="server"
														placeholder="Enter Password">
												</div>
											</div> 


											<div class="col-md-12 mt-4">
												<div class="form-group">
													<input type="button" id="btnlogsubmit" runat="server"
														Class="form-control shadow-none btn btn-danger" 
														value="Login into Application" />
												</div>
											</div>



										</div>
									</form>

								</div>
							</div>


							<div class="col-md-6 d-none d-md-flex rounded-end">
								<img src="/static/assets/images/auth.jpg" class="img-fluid" style="object-fit:cover;"
									alt="logo">
							</div>


						</div>
					</div>
				</div>
			</div>
		</div>



		<footer class="bg-danger text-uppercase text-white text-center border-top border-white fw-bold">
			Phishing Detection. All rights reserved <span id="year"></span>
